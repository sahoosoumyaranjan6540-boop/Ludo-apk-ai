<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241B3D"/>
      <stop offset="50%" stop-color="#101426"/>
      <stop offset="100%" stop-color="#0B0D1A"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2A3"/>
      <stop offset="50%" stop-color="#FFC857"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <radialGradient id="dieGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F5F5FA"/>
      <stop offset="100%" stop-color="#D5D9E8"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="105" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="90" fill="none" stroke="url(#goldGrad)" stroke-width="8" opacity="0.9"/>
  <rect x="28" y="28" width="456" height="456" rx="80" fill="none" stroke="#FFC857" stroke-width="2" opacity="0.4" stroke-dasharray="8 6"/>

  <!-- 4 Colored Quadrants -->
  <!-- Ruby Red (Top Left) -->
  <g transform="translate(64, 64)">
    <rect width="170" height="170" rx="28" fill="#EF476F" fill-opacity="0.9"/>
    <rect x="20" y="20" width="130" height="130" rx="20" fill="#101426" fill-opacity="0.6"/>
    <circle cx="50" cy="50" r="16" fill="#EF476F" stroke="#FFF" stroke-width="3"/>
    <circle cx="120" cy="50" r="16" fill="#EF476F" stroke="#FFF" stroke-width="3"/>
    <circle cx="50" cy="120" r="16" fill="#EF476F" stroke="#FFF" stroke-width="3"/>
    <circle cx="120" cy="120" r="16" fill="#EF476F" stroke="#FFF" stroke-width="3"/>
  </g>

  <!-- Emerald Jade (Top Right) -->
  <g transform="translate(278, 64)">
    <rect width="170" height="170" rx="28" fill="#06D6A0" fill-opacity="0.9"/>
    <rect x="20" y="20" width="130" height="130" rx="20" fill="#101426" fill-opacity="0.6"/>
    <circle cx="50" cy="50" r="16" fill="#06D6A0" stroke="#FFF" stroke-width="3"/>
    <circle cx="120" cy="50" r="16" fill="#06D6A0" stroke="#FFF" stroke-width="3"/>
    <circle cx="50" cy="120" r="16" fill="#06D6A0" stroke="#FFF" stroke-width="3"/>
    <circle cx="120" cy="120" r="16" fill="#06D6A0" stroke="#FFF" stroke-width="3"/>
  </g>

  <!-- Sapphire Blue (Bottom Left) -->
  <g transform="translate(64, 278)">
    <rect width="170" height="170" rx="28" fill="#118AB2" fill-opacity="0.9"/>
    <rect x="20" y="20" width="130" height="130" rx="20" fill="#101426" fill-opacity="0.6"/>
    <circle cx="50" cy="50" r="16" fill="#118AB2" stroke="#FFF" stroke-width="3"/>
    <circle cx="120" cy="50" r="16" fill="#118AB2" stroke="#FFF" stroke-width="3"/>
    <circle cx="50" cy="120" r="16" fill="#118AB2" stroke="#FFF" stroke-width="3"/>
    <circle cx="120" cy="120" r="16" fill="#118AB2" stroke="#FFF" stroke-width="3"/>
  </g>

  <!-- Imperial Gold (Bottom Right) -->
  <g transform="translate(278, 278)">
    <rect width="170" height="170" rx="28" fill="#FFC857" fill-opacity="0.9"/>
    <rect x="20" y="20" width="130" height="130" rx="20" fill="#101426" fill-opacity="0.6"/>
    <circle cx="50" cy="50" r="16" fill="#FFC857" stroke="#FFF" stroke-width="3"/>
    <circle cx="120" cy="50" r="16" fill="#FFC857" stroke="#FFF" stroke-width="3"/>
    <circle cx="50" cy="120" r="16" fill="#FFC857" stroke="#FFF" stroke-width="3"/>
    <circle cx="120" cy="120" r="16" fill="#FFC857" stroke="#FFF" stroke-width="3"/>
  </g>

  <!-- Center Crown & Royal 3D Dice -->
  <g transform="translate(256, 256)" filter="url(#glow)">
    <circle cx="0" cy="0" r="76" fill="#101426" stroke="url(#goldGrad)" stroke-width="7"/>
    <!-- Die cube rotated 8deg -->
    <g transform="rotate(-8)">
      <rect x="-42" y="-42" width="84" height="84" rx="18" fill="url(#dieGlow)" stroke="url(#goldGrad)" stroke-width="4"/>
      <!-- Dots for 6 -->
      <circle cx="-22" cy="-24" r="6" fill="#101426"/>
      <circle cx="-22" cy="0" r="6" fill="#101426"/>
      <circle cx="-22" cy="24" r="6" fill="#101426"/>
      <circle cx="22" cy="-24" r="6" fill="#101426"/>
      <circle cx="22" cy="0" r="6" fill="#101426"/>
      <circle cx="22" cy="24" r="6" fill="#101426"/>
    </g>
    <!-- Little Crown on top of die -->
    <path d="M -26 -56 L -36 -40 L -12 -44 L 0 -60 L 12 -44 L 36 -40 L 26 -56 Z" fill="url(#goldGrad)" stroke="#B8860B" stroke-width="1.5"/>
  </g>
</svg>
